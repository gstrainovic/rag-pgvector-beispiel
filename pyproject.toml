[project]
name = "rag-pgvector-beispiel"
version = "0.1.0"
description = "Kleines RAG-Beispiel: FastAPI, lokale Embeddings (fastembed), PostgreSQL mit pgvector"
readme = "README.md"
license = "MIT"
authors = [{ name = "Goran Strainovic", email = "info@strainovic-it.ch" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.40",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "fastembed>=0.8",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "testcontainers[postgres]>=4.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
