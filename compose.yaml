# Lokale Demo: alles ohne API-Schlüssel.
#   docker compose up --build          -> http://localhost:3000
# Erster Start lädt die Modelle (ca. 3.2 GB) in das Volume «ollama»; der Dienst ollama-init
# meldet sich, wenn sie bereit sind. Die API lädt danach die Beispieldokumente von selbst.
#
# Aufbau: web (Next.js, Port 3000) -> api (FastAPI, Port 8000) -> db (PostgreSQL mit pgvector).
# Der Browser spricht nur mit web; /api/* reicht Next an die API weiter.
#
# Cloud-Betrieb ohne Ollama (z. B. Mistral): Variablen aus .env.example in .env setzen und nur
# die Dienste db, api und web starten:
#   docker compose up --build db api web
# Für den Server siehe deploy/.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 15

  ollama:
    image: ollama/ollama:latest
    environment:
      # 2048 Token reichen für Systemprompt, 4–5 Absätze und die Antwort und halten das
      # Chat-Modell auf der 4-GB-GPU bei 2.9 GB (mit 4096: 3.5 GB).
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama:/root/.ollama
    # GPU (NVIDIA, braucht das NVIDIA Container Toolkit). Ohne GPU diese vier Zeilen löschen,
    # dann rechnet Ollama auf der CPU (Qwen3-4B: ca. 10 Token/s auf 12 Kernen statt 14 auf der P1000).
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    volumes:
      - ./ollama:/init:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding-cpu}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      # Grenzen der Demo, leer = Standardwert aus app/grenzen.py
      LIMIT_FRAGEN_PRO_TAG: ${LIMIT_FRAGEN_PRO_TAG:-}
      LIMIT_FRAGEN_PRO_MINUTE_IP: ${LIMIT_FRAGEN_PRO_MINUTE_IP:-}
      LIMIT_DOKUMENTE_PRO_SITZUNG: ${LIMIT_DOKUMENTE_PRO_SITZUNG:-}
      LIMIT_ABSAETZE_PRO_DOKUMENT: ${LIMIT_ABSAETZE_PRO_DOKUMENT:-}
      LIMIT_UPLOADS_PRO_TAG: ${LIMIT_UPLOADS_PRO_TAG:-}
    ports:
      - "8000:8000" # nur für die API-Doku unter /docs; die Oberfläche braucht den Port nicht
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
